name: CI / Production Build Verification

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Lint, Typecheck & Next.js Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Next.js Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://mock-ci-project.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: mock-anon-key-ci-environment-12345
          SUPABASE_SERVICE_ROLE_KEY: mock-service-role-key-ci-67890
